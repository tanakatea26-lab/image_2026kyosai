<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>館林猛暑サバイバル (スマホ版)</title>
    <style>
        body { 
            text-align: center; 
            background: #fdf5e6; 
            font-family: sans-serif; 
            margin: 0; 
            overflow: hidden; /* スクロール禁止 */
            touch-action: none; /* ブラウザのデフォルト動作（ズーム等）を無効化 */
        }
        canvas { 
            background: #87CEEB; 
            display: block; 
            margin: 0 auto;
            border-bottom: 2px solid #ff4500;
        }
        h1 { color: #d2691e; font-size: 20px; margin: 10px 0; }
        .info { font-size: 14px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h1>館林猛暑サバイバル</h1>
    <p class="info">画面の左側・右側をタップしてタヌキを操作！</p>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // スマホ画面サイズに合わせてキャンバスを調整
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 100;

        let score = 0;
        let gameOver = false;

        // プレイヤー（タヌキ）
        const player = { 
            x: canvas.width / 2 - 20, 
            y: canvas.height - 80, 
            width: 40, 
            height: 40, 
            speed: 7 
        };
        
        let objects = [];
        let moveDirection = 0; // -1: 左, 1: 右, 0: 停止

        function spawnObject() {
            const x = Math.random() * (canvas.width - 30);
            const isItem = Math.random() > 0.7;
            objects.push({ x, y: -30, width: 30, height: 30, isItem });
        }

        // --- 操作系 (キーボード + タッチ) ---
        window.addEventListener("keydown", (e) => {
            if (e.code === "ArrowLeft") moveDirection = -1;
            if (e.code === "ArrowRight") moveDirection = 1;
        });
        window.addEventListener("keyup", () => moveDirection = 0);

        // タッチ開始
        window.addEventListener("touchstart", (e) => {
            const touchX = e.touches[0].clientX;
            if (touchX < window.innerWidth / 2) {
                moveDirection = -1; // 画面左をタップ
            } else {
                moveDirection = 1;  // 画面右をタップ
            }
            if(gameOver) location.reload(); // ゲームオーバー時にタップでリロード
        });

        // タッチ終了
        window.addEventListener("touchend", () => moveDirection = 0);

        function update() {
            if (gameOver) return;

            // 移動処理
            if (moveDirection === -1 && player.x > 0) player.x -= player.speed;
            if (moveDirection === 1 && player.x < canvas.width - player.width) player.x += player.speed;

            if (Math.random() < 0.05) spawnObject();

            objects.forEach((obj, index) => {
                obj.y += 4; // 少し速度アップ
                
                if (obj.x < player.x + player.width && obj.x + obj.width > player.x &&
                    obj.y < player.y + player.height && obj.y + obj.height > player.y) {
                    if (obj.isItem) {
                        score += 10;
                        objects.splice(index, 1);
                    } else {
                        gameOver = true;
                    }
                }
                if (obj.y > canvas.height) objects.splice(index, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // プレイヤー
            ctx.fillStyle = "#8b4513";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "white";
            ctx.font = "12px Arial";
            ctx.fillText("タヌキ", player.x + 2, player.y + 25);

            // オブジェクト
            objects.forEach(obj => {
                ctx.font = "25px serif";
                ctx.fillText(obj.isItem ? "🍜" : "☀️", obj.x, obj.y + 20);
            });

            // スコア
            ctx.fillStyle = "black";
            ctx.font = "bold 20px Arial";
            ctx.fillText(`館林の熱気: ${score}`, 15, 30);

            if (gameOver) {
                ctx.fillStyle = "rgba(255, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 30px Arial";
                ctx.textAlign = "center";
                ctx.fillText("熱中症でリタイア！", canvas.width / 2, canvas.height / 2);
                ctx.font = "20px Arial";
                ctx.fillText("タップで再挑戦", canvas.width / 2, canvas.height / 2 + 50);
            } else {
                requestAnimationFrame(() => {
                    update();
                    draw();
                });
            }
        }

        draw();
    </script>
</body>
</html>
