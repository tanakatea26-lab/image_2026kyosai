<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>館林猛暑サバイバル</title>
    <style>
        body { text-align: center; background: #fdf5e6; font-family: sans-serif; }
        canvas { background: #87CEEB; border: 5px solid #ff4500; display: block; margin: 0 auto; }
        h1 { color: #d2691e; }
    </style>
</head>
<body>
    <h1>館林猛暑サバイバル</h1>
    <p>左右キーでタヌキを操作！太陽を避けて「うどん(U)」を拾え！</p>
    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let gameOver = false;

        // プレイヤー（タヌキ）
        const player = { x: 180, y: 440, width: 40, height: 40, speed: 5 };
        
        // 障害物（太陽）とアイテム（うどん）
        let objects = [];

        function spawnObject() {
            const x = Math.random() * (canvas.width - 30);
            const isItem = Math.random() > 0.7; // 30%の確率でアイテム
            objects.push({ x, y: -30, width: 30, height: 30, isItem });
        }

        let keys = {};
        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        function update() {
            if (gameOver) return;

            if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
            if (keys["ArrowRight"] && player.x < canvas.width - player.width) player.x += player.speed;

            if (Math.random() < 0.05) spawnObject();

            objects.forEach((obj, index) => {
                obj.y += 3;
                
                // 当たり判定
                if (obj.x < player.x + player.width && obj.x + obj.width > player.x &&
                    obj.y < player.y + player.height && obj.y + obj.height > player.y) {
                    if (obj.isItem) {
                        score += 10;
                        objects.splice(index, 1);
                    } else {
                        gameOver = true;
                    }
                }

                if (obj.y > canvas.height) objects.splice(index, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // プレイヤー（茶釜タヌキ風）
            ctx.fillStyle = "#8b4513";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "white";
            ctx.fillText("タヌキ", player.x + 2, player.y + 25);

            // オブジェクト
            objects.forEach(obj => {
                if (obj.isItem) {
                    ctx.fillStyle = "white";
                    ctx.font = "20px serif";
                    ctx.fillText("🍜", obj.x, obj.y + 20);
                } else {
                    ctx.fillStyle = "red";
                    ctx.font = "25px serif";
                    ctx.fillText("☀️", obj.x, obj.y + 20);
                }
            });

            // スコア表示
            ctx.fillStyle = "black";
            ctx.font = "20px Arial";
            ctx.fillText(`Score: ${score}`, 10, 30);

            if (gameOver) {
                ctx.fillStyle = "red";
                ctx.font = "40px Arial";
                ctx.fillText("熱中症！終了！", 60, 250);
            } else {
                requestAnimationFrame(() => {
                    update();
                    draw();
                });
            }
        }

        draw();
    </script>
</body>
</html>
